        .article-body .subtitle { color: #a3a3a3; font-size: 1rem; margin-bottom: 2rem; font-weight: 300; line-height: 1.6; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 1.5rem; }
        .article-body h2 { font-size: 1.2rem; font-weight: 600; margin: 2.5rem 0 0.75rem; color: #f7941d; letter-spacing: -0.02em; }

        .article-body table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; font-size: 0.85rem; }
        .article-body th { text-align: left; padding: 0.6rem 0.9rem; color: #f7941d; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(247,148,29,0.2); }

        #wiki-search { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.07); color: #e5e5e5; font-size: 0.8rem; border-radius: 4px; padding: 0.5rem 0.75rem; width: 100%; outline: none; transition: border-color 0.2s; font-family: 'Inter', sans-serif; }

        /* Mobile sidebar toggle */
        #sidebar-toggle { display: none; }
        @media (max-width: 768px) {

            #wiki-sidebar {

                transform: translateX(100%);

        .article-body .img-caption { text-align: center; font-size: 0.78rem; color: #555; margin-top: -0.5rem; margin-bottom: 1rem; }

'rive': `<h1>Rive</h1>
<p class="subtitle">Nền tảng thiết kế và hoạt hình tương tác — designer và developer làm việc trong cùng một công cụ, xuất ra sản phẩm chạy thực trên mọi nền tảng.</p>
<div class="tags"><span class="tag">entity</span><span class="tag">cong-cu</span><span class="tag">motion-design</span><span class="tag">cross-platform</span></div>
<h2>Tổng quan</h2>
<p>Rive là công cụ thiết kế, hoạt hình và lập trình tích hợp trong một. Điểm khác biệt cốt lõi so với quy trình truyền thống (Figma → After Effects → Lottie → developer): <strong>thứ bạn tạo ra trong editor chính xác là thứ được chạy trong ứng dụng</strong> — không cần mockup, không cần prototype, không cần bàn giao tài sản qua lại.</p>
<p>Rive sử dụng <strong>Rive Renderer</strong> — một engine đồ họa vector tăng tốc GPU, chạy ở 120fps. Các file hoạt hình được biên dịch thành định dạng <code>.riv</code>, sau đó chạy qua <strong>runtime mã nguồn mở</strong> trên từng nền tảng.</p>
<div class="meta-grid">

'editor-interface': `<h1>Giao diện Rive Editor</h1>
<p class="subtitle">Tổng quan 5 thành phần giao diện — nơi bạn thiết kế, tạo hoạt hình và xây dựng logic tương tác.</p>
<div class="tags"><span class="tag">giao-dien</span><span class="tag">editor</span><span class="tag">co-ban</span></div>
<h2>Tổng quan</h2>
<p>Giao diện Rive thiết kế theo nguyên tắc <strong>"chỉ hiển thị những gì cần thiết tại thời điểm đó"</strong>. Các panel thay đổi theo ngữ cảnh — Timeline chỉ xuất hiện ở Animate Mode; State Machine graph chỉ hiện khi chọn State Machine.</p>

<div class="tags"><span class="tag">design-mode</span><span class="tag">animate-mode</span><span class="tag">workflow</span></div>
<h2>Tổng quan</h2>
<p>Việc tách hai chế độ xuất phát từ đặc điểm cốt lõi: <strong>một artboard có thể gắn nhiều animation</strong>. Cần một chế độ để thiết lập đồ họa (Design Mode) và một chế độ để tạo chuyển động (Animate Mode).</p>
<p>Chuyển đổi: nút toggle trên Toolbar hoặc phím tắt <code>Tab</code>.</p>
<h2>Design Mode</h2>
<p><strong>Mục đích:</strong> Chuẩn bị đồ họa cho animation.</p>
<ul>
<li>Thiết kế đồ họa bằng Pen Tool, Procedural Shapes</li>
<li>Import đồ họa từ bên ngoài (SVG, PNG, PSD, JSON...)</li>
<li>Rig đồ họa bằng <strong>Bones</strong>, <strong>Transform Spaces</strong>, <strong>Layouts</strong>, <strong>Joysticks</strong>, <strong>Constraints</strong></li>
</ul>
<p>Đây là chế độ mặc định khi mở file chưa có animation.</p>
<h2>Animate Mode</h2>
<p><strong>Mục đích:</strong> Tạo tất cả States và State Machine cho artboard.</p>
<ul>
<li>Danh sách Timelines và State Machines xuất hiện ở phía dưới</li>
<li>Inspector hiển thị thêm nút key (◆) cạnh mỗi thuộc tính có thể animate</li>
<li>Chọn Animation → hiển thị Timeline; chọn State Machine → State Machine graph</li>
</ul>
<h2>Tạo đồ họa trong Animate Mode — những điều cần lưu ý</h2>
<div class="warn-box"><p>⚠️ <strong>Trường hợp 1 — Timeline đang chọn:</strong> Mọi thay đổi về path, shape, thuộc tính sẽ <strong>tự động được keyframe</strong>. Không nên tạo/sửa đồ họa khi có Timeline được chọn — hãy quay về Design Mode.</p></div>
<p><strong>Trường hợp 2 — State Machine đang chọn:</strong> Animate Mode hoạt động giống Design Mode — tạo đồ họa, rig, thay đổi thiết kế tự do không bị keyframe.</p>
<h2>So sánh</h2>
<table>
<tr><th></th><th>Design Mode</th><th>Animate Mode (Timeline)</th><th>Animate Mode (State Machine)</th></tr>
<tr><td>Mục đích</td><td>Thiết kế &amp; rig</td><td>Tạo keyframe</td><td>Xây dựng logic</td></tr>
<tr><td>Tạo đồ họa</td><td>Tự do</td><td>⚠️ Tự động key</td><td>Tự do</td></tr>
<tr><td>Timeline</td><td>Ẩn</td><td>Hiển thị</td><td>Ẩn (SM graph thay)</td></tr>
</table>`,

'artboard': `<h1>Artboard</h1>
<p class="subtitle">Đơn vị cơ bản nhất trong mọi file Rive — mọi thiết kế và hoạt hình đều bắt đầu từ đây.</p>
<div class="tags"><span class="tag">artboard</span><span class="tag">khung-ve</span><span class="tag">co-ban</span></div>
<h2>Tổng quan</h2>
<p>Artboard là nền tảng của mọi composition trong cả Design Mode và Animate Mode. Nó đóng vai trò là <strong>gốc rễ của mọi cây Hierarchy</strong> — xác định kích thước và màu nền của một cảnh. Một file Rive có thể chứa vô số artboard, nhưng cần ít nhất một.</p>
<p>Hiểu đơn giản: Artboard giống một "trang" — mỗi trang có kích thước riêng, màu nền riêng, và bộ hoạt hình riêng.</p>
<h2>Artboard đang Active</h2>
<p>Chỉ có <strong>một</strong> artboard active tại một thời điểm (đánh dấu bằng tag "Active" trên Stage). <strong>Các panel chỉ hiển thị nội dung của artboard active.</strong></p>
<p>Để active: click vào artboard hoặc bất kỳ đối tượng con nào trên Stage.</p>
<h2>Default State Machine</h2>
<p>Mỗi artboard có thể đặt một <strong>Default State Machine</strong> — được phát khi nhấn Play trong Toolbar, và là State Machine mà developer thấy khi dùng file trong runtime.</p>
<p>Phím tắt: <code>Shift</code>+<code>Spacebar</code> để phát từ Design Mode.</p>
<h2>Tạo Artboard</h2>
<ol>
<li>Trong file mới: nhập kích thước hoặc chọn preset → "Create Artboard"</li>
<li>Dùng <strong>Artboard Tool</strong> (phím <code>A</code>): click và kéo trên Stage</li>
</ol>
<h2>Thuộc tính Artboard</h2>
<h3>Kích thước (Size Type)</h3>
<ul>
<li><strong>Fixed</strong> (mặc định): kích thước cố định, có thể animate</li>
<li><strong>Hug</strong>: tự co giãn theo kích thước đối tượng con (cần ít nhất một Layout con)</li>
</ul>
<h3>Gốc tọa độ (Origin)</h3>
<p>Xác định điểm mà từ đó mọi đối tượng được đo. Mặc định: X:0%, Y:0% (góc trên trái).</p>
<div class="warn-box"><p>⚠️ Nên thay đổi origin <strong>trước khi</strong> tạo animation. Thay đổi sau khi đã có keyframe có thể làm đối tượng bị lệch vị trí.</p></div>
<h3>Fill và Stroke</h3>
<p>Artboard có thể có fill và stroke giống các đối tượng thông thường.</p>
<h3>Selected Colors</h3>
<p>Khi chọn artboard, Inspector hiển thị tất cả màu sắc của mọi đối tượng bên trong — hữu ích để điều chỉnh màu nhanh.</p>
<h3>Render Presets</h3>
<p>Tạo preset để xuất đồ họa tĩnh (PNG, SVG) hoặc video (PNG sequence, MP4).</p>`,

'shapes-paths': `<h1>Hình dạng và Đường dẫn</h1>
<p class="subtitle">Cách Rive biểu diễn đồ họa vector — nền tảng để tạo mọi asset trong editor.</p>
<div class="tags"><span class="tag">shape</span><span class="tag">path</span><span class="tag">vector</span><span class="tag">pen-tool</span></div>
<h2>Tổng quan</h2>
<p>Rive tách biệt rõ ràng: <strong>Shape layer</strong> (lớp hình dạng) và <strong>Path layer</strong> (lớp đường dẫn). Hiểu sự phân tách này giúp animate đồ họa linh hoạt hơn nhiều.</p>
<h2>Shape Layer (Lớp Hình dạng)</h2>
<p>Shape layer là <strong>lớp render</strong> — xác định <strong>kiểu hiển thị</strong>: màu fill, stroke, blend mode, opacity. Mỗi Shape layer có thể chứa nhiều Path layer bên trong, tất cả chia sẻ cùng style.</p>
<pre><code>Shape Layer (định nghĩa fill/stroke)
  └── Path Layer 1 (hình dạng thực tế)
  └── Path Layer 2 (thêm path vào shape)</code></pre>
<h2>Path Layer (Lớp Đường dẫn)</h2>
<p>Path layer là <strong>lớp geometry</strong> — xác định hình dạng thực tế qua các vertex. Hai loại path:</p>
<h3>Procedural Path (Đường dẫn thủ tục)</h3>
<p>Định nghĩa bằng tham số hình học. Rive cung cấp sẵn: Rectangle, Ellipse, Polygon, Star...</p>
<ul>
<li>Tạo: Vector Tools menu → chọn hình → click và kéo; giữ <code>Shift</code> để giữ tỉ lệ</li>
<li><strong>Điểm mạnh</strong>: có thể animate các tham số — ví dụ animate bán kính góc</li>
<li>Chuyển sang Custom Path: nhấn <code>Enter</code> khi đang chọn path (không thể hoàn tác tham số thủ tục)</li>
</ul>
<h3>Custom Path (Đường dẫn tùy chỉnh)</h3>
<p>Tạo thủ công bằng Pen Tool — đặt vertex và kiểm soát bezier handles tùy ý.</p>
<h2>Pen Tool</h2>
<p>Phím <code>P</code> hoặc từ Vector Tools menu.</p>
<ul>
<li>Click → vertex góc thẳng</li>
<li>Click + kéo → vertex với bezier handles (đường cong)</li>
<li><code>Esc</code> khi hoàn thành</li>
</ul>
<h3>Phím tắt Pen Tool</h3>
<table>
<tr><th>Thao tác</th><th>macOS</th><th>Windows</th></tr>
<tr><td>Tách handle khi đang vẽ</td><td>Alt/Opt</td><td>Alt</td></tr>
<tr><td>Chuyển mirrored ↔ straight</td><td>Cmd+click vertex</td><td>Ctrl+click vertex</td></tr>
<tr><td>Xóa một handle</td><td>Cmd+click handle</td><td>Ctrl+click handle</td></tr>
<tr><td>Tách một handle</td><td>Opt+click handle</td><td>Alt+click handle</td></tr>
<tr><td>Nhân đôi vertex</td><td>Opt+kéo</td><td>Alt+kéo</td></tr>
</table>
<h2>Điều hướng Shape/Path</h2>
<ul>
<li>Chọn Shape → <code>Enter</code> → chọn Path con</li>
<li>Chọn Path → <code>Esc</code> → quay lên Shape cha</li>
</ul>
<h2>Thêm Path vào Shape có sẵn</h2>
<p>Kéo thả Path layer vào Shape layer trong Hierarchy. Path dùng style của Shape đích.</p>`,

'fill-stroke': `<h1>Fill và Stroke</h1>
<p class="subtitle">Định nghĩa và tùy chỉnh màu sắc, đường viền, gradient, và hiệu ứng feathering cho mọi đối tượng.</p>
<div class="tags"><span class="tag">fill</span><span class="tag">stroke</span><span class="tag">gradient</span><span class="tag">feather</span></div>
<h2>Tổng quan</h2>
<p>Mỗi Shape layer có thể có <strong>nhiều Fill và Stroke</strong> xếp chồng lên nhau. Tất cả thuộc tính đều có thể <strong>animate</strong> trên Timeline.</p>
<p>Thêm Fill hoặc Stroke: chọn shape → Inspector → Fill &amp; Stroke → nhấn <code>+</code>.</p>
<h2>Fill (Màu nền)</h2>
<h3>Các loại Fill</h3>
<table>
<tr><th>Loại</th><th>Mô tả</th></tr>
<tr><td><strong>Solid</strong></td><td>Màu đơn sắc. Mặc định khi tạo shape mới</td></tr>
<tr><td><strong>Linear Gradient</strong></td><td>Gradient tuyến tính. Mặc định khi thêm fill mới</td></tr>
<tr><td><strong>Radial Gradient</strong></td><td>Gradient tỏa tròn từ tâm</td></tr>
</table>
<h3>Fill Rule</h3>
<ul>
<li><strong>Non-Zero</strong>: vùng có giá trị chiều vẽ ≠ 0 được fill</li>
<li><strong>Even-Odd</strong>: vùng có giá trị chẵn được fill, lẻ không fill</li>
<li><strong>Clockwise</strong> *(đặc trưng Rive)*: trừ path thủ công. Bắt buộc để dùng Vector Feathering</li>
</ul>
<h2>Stroke (Đường viền)</h2>
<h3>Thuộc tính Stroke</h3>
<p><strong>Cap</strong> — đầu mút:</p>
<ul>
<li><strong>Butt</strong>: thẳng, không vượt ra ngoài vertex</li>
<li><strong>Round</strong>: đầu tròn</li>
<li><strong>Square</strong>: vuông, nhô ra ngoài vertex</li>
</ul>
<p><strong>Join</strong> — góc nối: <strong>Round</strong>, <strong>Bevel</strong>, <strong>Miter</strong>.</p>
<p><strong>Stroke Type</strong>:</p>
<ul>
<li><strong>Solid</strong>: stroke đặc (mặc định)</li>
<li><strong>Trim</strong>: animate điểm đầu/cuối — tạo hiệu ứng "đường vẽ ra" (draw-on)</li>
<li><strong>Dashed</strong>: nét đứt với độ dài và offset có thể animate</li>
</ul>
<p><strong>Apply Transformations</strong>: tắt để giữ độ dày stroke không đổi khi scale.</p>
<h2>Vector Feathering</h2>
<p>Kỹ thuật làm mờ cạnh vector không ảnh hưởng hiệu năng. Fill Rule phải là <strong>Clockwise</strong>.</p>
<table>
<tr><th>Tùy chọn</th><th>Mô tả</th></tr>
<tr><td>Direction</td><td><strong>Outer</strong> = mờ ra ngoài; <strong>Inner</strong> = mờ vào trong</td></tr>
<tr><td>Amount</td><td>Mức độ mờ</td></tr>
<tr><td>Space</td><td><strong>World</strong> (như drop shadow); <strong>Local</strong> (theo không gian đối tượng)</td></tr>
<tr><td>Offset X/Y</td><td>Dịch chuyển vùng mờ khỏi path</td></tr>
</table>
<h2>Effect Groups</h2>
<p>Áp dụng một bộ path effects (trim, dash...) cho <strong>nhiều stroke/fill cùng lúc</strong> từ một điểm kiểm soát duy nhất.</p>`,

'groups-hierarchy': `<h1>Nhóm và Phân cấp</h1>
<p class="subtitle">Cách Rive tổ chức đối tượng, truyền transform, và kiểm soát thứ tự vẽ — nền tảng của animation phức tạp.</p>
<div class="tags"><span class="tag">group</span><span class="tag">hierarchy</span><span class="tag">draw-order</span><span class="tag">cha-con</span></div>
<h2>Tổng quan</h2>
<p>Hierarchy trong Rive là cây cấu trúc cha-con vô hạn cấp, phục vụ hai mục đích:</p>
<ol>
<li><strong>Quan hệ cha-con</strong> — cha truyền transform cho con</li>
<li><strong>Draw Order</strong> — xác định thứ tự render</li>
</ol>
<h2>Quan hệ cha-con</h2>
<p>Khi đối tượng là con, nó <strong>kế thừa mọi transform</strong> của cha: Scale, Rotation, Position. Lồng nhau vô hạn cấp.</p>
<p>Trong Rive, <strong>Groups</strong> và <strong>Bones</strong> là hai loại đối tượng có thể có con.</p>
<h2>Groups (Nhóm)</h2>
<p>Group là container để tổ chức đồ họa và thêm transform space trung gian.</p>
<ul>
<li>Tạo group trống: phím <code>G</code> → click artboard</li>
<li>Gộp shape vào group: <code>⌘G</code> (Mac) / <code>Ctrl+G</code> (Win)</li>
<li>Bỏ group: <code>⌘⇧G</code> / <code>Ctrl+Shift+G</code></li>
</ul>
<h3>Group Style: Group vs Target</h3>
<ul>
<li><strong>Group (mặc định)</strong>: cần double-click hoặc Enter/Esc để vào bên trong</li>
<li><strong>Target</strong>: click thẳng vào đối tượng con không cần double-click. Hữu ích với Constraints</li>
</ul>
<h2>Điều hướng trong Hierarchy</h2>
<h3>1. Double-click</h3>
<p>Click group → rồi double-click vào đối tượng con muốn chọn.</p>
<h3>2. Enter / Esc</h3>
<ul>
<li><code>Enter</code> → đi xuống một cấp</li>
<li><code>Esc</code> → đi lên một cấp</li>
</ul>
<h3>3. Deep Select</h3>
<p>Giữ <code>⌘</code> (Mac) / <code>Ctrl</code> (Win) + click thẳng vào đối tượng bất kể cấp. Cách nhanh nhất trong file phức tạp.</p>
<h2>Draw Order</h2>
<ul>
<li>Đối tượng <strong>trên cùng</strong> trong Hierarchy → vẽ <strong>phía trước</strong></li>
<li>Đối tượng <strong>dưới cùng</strong> → vẽ <strong>phía sau</strong></li>
<li>Draw Order có thể animate (dùng Hold key)</li>
</ul>
<h2>Assets Panel và Data Panel</h2>
<p><strong>Assets Panel:</strong> Hình ảnh (PNG, JPG), file Lottie, âm thanh, font chữ nhập vào file.</p>
<p><strong>Data Panel:</strong> View Models, Enums, Converters — dùng cho Data Binding.</p>`,

'edit-vertices': `<h1>Chỉnh sửa Đỉnh, Freeze và Transform Spaces</h1>
<p class="subtitle">Ba khái niệm liên quan đến kiểm soát hình dạng và điểm gốc biến đổi trong Rive.</p>
<div class="tags"><span class="tag">edit-vertices</span><span class="tag">freeze</span><span class="tag">transform-spaces</span><span class="tag">bezier</span></div>
<h2>Edit Vertices Mode</h2>
<p>Chỉnh sửa từng vertex và bezier handle của path — hoạt động trong cả Design Mode lẫn Animate Mode.</p>
<p><strong>Vào Edit Vertices Mode:</strong></p>
<ul>
<li>Chọn Shape → nhấn <code>Enter</code> hai lần (một lần chọn Path, lần hai vào Edit Vertices)</li>
<li>Hoặc chọn Path → nhấn <code>Enter</code> một lần</li>
</ul>
<h3>Tùy chọn Path</h3>
<table>
<tr><th>Tùy chọn</th><th>Chức năng</th></tr>
<tr><td>Done Editing</td><td>Thoát Edit Vertices Mode</td></tr>
<tr><td>Open Path</td><td>Chuyển path đóng thành hở</td></tr>
<tr><td>Reverse Direction</td><td>Đảo chiều vẽ — tạo hoặc xóa lỗ hổng với Fill Rule Non-Zero/Even-Odd</td></tr>
<tr><td>Convert Radial Corners</td><td>Chuyển corner radius sang vertex cố định — tránh biến dạng khi scale</td></tr>
</table>
<h3>Các loại Bezier Handle</h3>
<table>
<tr><th>Loại</th><th>Đặc điểm</th></tr>
<tr><td><strong>Straight</strong></td><td>Mặc định — cạnh thẳng</td></tr>
<tr><td><strong>Corner Radius</strong></td><td>Bo tròn góc không thêm vertex mới</td></tr>
<tr><td><strong>Mirrored</strong></td><td>Hai handle đối xứng (cùng góc, cùng dài)</td></tr>
<tr><td><strong>Detached</strong></td><td>Mỗi handle độc lập hoàn toàn</td></tr>
<tr><td><strong>Asymmetric</strong></td><td>Cùng góc, độ dài độc lập</td></tr>
</table>
<h2>Freeze Mode & Origin</h2>
<h3>Vấn đề Origin</h3>
<p>Scale hoặc rotate xảy ra từ <strong>điểm gốc (origin)</strong> của đối tượng. Muốn thay đổi origin của Group mà không làm dịch chuyển con → dùng <strong>Freeze Mode</strong>.</p>
<h3>Freeze Mode</h3>
<p>Bật: <code>Y</code> hoặc Freeze trong Transform Tools. Khi active, Stage hiển thị viền xanh — di chuyển đối tượng cha mà <strong>con không bị ảnh hưởng</strong> (thực chất đang dịch chuyển origin của cha). Tắt: <code>Y</code> lần nữa.</p>
<h3>Cách nhanh thay đổi Origin</h3>
<p>Giữ <code>Option</code> (Mac) / <code>Alt</code> (Win) → dùng Align Tools trong Inspector để căn origin về vị trí mong muốn.</p>
<h2>Transform Spaces</h2>
<p>Container objects (Groups, Bones, Layouts) tạo ra <strong>không gian biến đổi riêng biệt</strong> cho con bên trong.</p>
<p><strong>Ví dụ — Hệ Mặt trời:</strong></p>
<pre><code>Group A: xoay → Trái Đất quay quanh Mặt Trời
  └── Group B: xoay → Trái Đất tự quay
        └── Group C: xoay → Mặt Trăng quay quanh Trái Đất
              └── Group D: xoay → Mặt Trăng tự quay</code></pre>
<p>Mỗi Group tạo một transform space riêng. Lồng Groups → mỗi Group thêm một bậc tự do cho chuyển động. Đây là cách tạo mọi animation cơ khí, nhân vật, orbital system...</p>`,

'import-asset': `<h1>Import Asset và Lịch sử Phiên bản</h1>
<p class="subtitle">Cách đưa đồ họa từ bên ngoài vào Rive và quản lý lịch sử lưu trữ file.</p>
<div class="tags"><span class="tag">import</span><span class="tag">svg</span><span class="tag">figma</span><span class="tag">revision-history</span></div>
<h2>Import Asset</h2>
<p>Kéo thả file vào Rive Editor → xuất hiện trong <strong>Assets Panel</strong> (tab bên trái). Kéo thả lên artboard để sử dụng.</p>
<h3>Định dạng được hỗ trợ</h3>
<table>
<tr><th>Định dạng</th><th>Ghi chú</th></tr>
<tr><td><strong>SVG</strong></td><td>Hỗ trợ tốt nhất</td></tr>
<tr><td><strong>PNG, JPG</strong></td><td>Ảnh raster</td></tr>
<tr><td><strong>PSD</strong></td><td>Photoshop — chỉ vector layers, không flatten</td></tr>
<tr><td><strong>JSON (Lottie)</strong></td><td>Chỉ gói Enterprise</td></tr>
<tr><td><strong>OTF / TTF</strong></td><td>Font chữ tùy chỉnh — chỉ gói Pro trở lên</td></tr>
</table>
<h3>Copy từ Figma</h3>
<p>Trong Figma → chọn object → <strong>Copy as SVG</strong> → Paste vào Rive Editor. Không cần lưu file trung gian.</p>
<h3>Cập nhật Asset</h3>
<p>Chọn asset trong Assets Panel → Inspector → nút <strong>Replace</strong>. Tất cả instances tự động cập nhật.</p>
<h2>SVG — Lưu ý quan trọng</h2>
<h3>Cài đặt tốt nhất khi xuất</h3>
<p><strong>Từ Figma:</strong> Dùng "Copy as SVG" và paste thẳng — đơn giản nhất.</p>
<p><strong>Từ Illustrator:</strong> CSS Properties = <strong>Presentation Attributes</strong>; tắt "Preserve Illustrator Editing Capabilities".</p>
<h3>Tính năng SVG chưa được hỗ trợ</h3>
<ul>
<li>Embedded images trong SVG — bị bỏ qua</li>
<li>Gradient transforms — bị bỏ qua</li>
<li>Đơn vị pt hoặc mm — auto convert (1pt=1.33px; 1mm=3.78px)</li>
<li><code>filter</code>, <code>skew</code> — không hỗ trợ</li>
<li><code>inherit</code> cho màu — mặc định thành trắng</li>
</ul>
<h2>Revision History (Lịch sử Phiên bản)</h2>
<p>Rive <strong>tự động lưu</strong> tất cả thay đổi, kể cả khi nhiều người cùng làm một file.</p>
<p><strong>Truy cập:</strong> Toolbar → Editor menu → Revision History.</p>
<h3>Xem lại phiên bản cũ</h3>
<p>Chọn revision → preview xuất hiện. Nhấn <strong>Edit Current Revision</strong> để khôi phục — Rive tạo bản sao mới ở đầu danh sách, <strong>không ghi đè</strong>.</p>
<h3>Lưu Revision thủ công</h3>
<p>Editor menu → Create Revision → đặt tên. Hữu ích để đánh dấu milestone: "Trước khi thêm State Machine", "Version client approved".</p>`,

'animate-mode': `<h1>Animate Mode — Timeline, Keys & Interpolation</h1>
<p class="subtitle">Toàn bộ hệ thống tạo hoạt hình dựa trên keyframe trong Rive.</p>
<div class="tags"><span class="tag">animate-mode</span><span class="tag">timeline</span><span class="tag">keyframe</span><span class="tag">easing</span></div>
<h2>Tổng quan</h2>
<p>Khi chuyển sang Animate Mode (<code>Tab</code>), giao diện thay đổi: danh sách animation của artboard active, nút key (◆) cạnh thuộc tính trong Inspector, và Timeline/State Machine graph ở dưới.</p>
<h2>Timeline</h2>
<h3>Các loại Animation</h3>
<table>
<tr><th>Loại</th><th>Hành vi</th></tr>
<tr><td><strong>One-Shot</strong></td><td>Playhead dừng ở cuối</td></tr>
<tr><td><strong>Loop</strong></td><td>Lặp liên tục từ đầu đến cuối</td></tr>
<tr><td><strong>Ping-Pong</strong></td><td>Chạy xuôi đến cuối rồi ngược về đầu, lặp lại</td></tr>
</table>
<h3>Tùy chọn Timeline</h3>
<ul>
<li><strong>Current</strong> — vị trí hiện tại của playhead</li>
<li><strong>Duration</strong> — tổng độ dài animation</li>
<li><strong>Playback Speed</strong> — tốc độ phát (âm = phát ngược)</li>
<li><strong>Snap Keys</strong> — khoảng cách tối thiểu giữa các key (mặc định: 1/60 giây)</li>
</ul>
<h2>Keys (Keyframe)</h2>
<h3>Đặt Key — 3 cách</h3>
<ol>
<li><strong>Thao tác trực tiếp trên Stage</strong> — di chuyển, xoay, scale → key tự động tạo</li>
<li><strong>Thay đổi giá trị trong Inspector</strong> → key được tạo nếu chưa có</li>
<li><strong>Nhấn nút key (◆)</strong> trong Inspector — đặt key cho giá trị hiện tại</li>
</ol>
<h3>Trạng thái nút key</h3>
<ul>
<li>Viền xám — chưa có key nào</li>
<li>Viền xanh — đã key (nhưng không phải tại vị trí playhead hiện tại)</li>
<li>Nền xanh — có key đúng tại vị trí playhead</li>
</ul>
<h3>Quản lý Keys</h3>
<ul>
<li>Di chuyển: click và kéo key trên Timeline</li>
<li>Copy/Paste keys giữa các đối tượng</li>
<li><strong>Resize</strong>: giữ <code>Alt</code> + kéo từ đầu/cuối nhóm keys — co giãn toàn bộ đoạn animation</li>
</ul>
<h2>Interpolation / Easing</h2>
<p>Khi có hai key, Rive tự động tính giá trị ở giữa. Chỉnh easing trong <strong>Interpolation Panel</strong> hoặc <strong>Graph Editor</strong>.</p>
<h3>Ba kiểu Interpolation</h3>
<p><strong>Linear:</strong> Tốc độ đều đặn — kết quả chuyển động đều, đôi khi cảm giác máy móc.</p>
<p><strong>Cubic:</strong> Đường cong bezier — mặc định chậm đầu và cuối, nhanh giữa (ease in-out). Kéo handles để tùy chỉnh bất kỳ curve nào.</p>
<p><strong>Hold:</strong> Không nội suy — giữ nguyên giá trị đến key tiếp theo, tại đó thay đổi tức thì. Bắt buộc cho Draw Order animation.</p>
<h3>Graph Editor</h3>
<p>Bật từ Timeline. Hiển thị cách giá trị thay đổi theo thời gian (X = thời gian, Y = giá trị). Hai chế độ:</p>
<ul>
<li><strong>Cubic Interpolation</strong>: chỉnh qua Interpolation Panel</li>
<li><strong>Cubic Value</strong>: chỉnh trực tiếp trên graph — thay đổi giá trị thực tế, tạo overshoot hay bounce</li>
</ul>
<h2>Animating Draw Order</h2>
<ol>
<li>Chọn group/shape → Inspector → Draw Order → tạo <strong>Draw Order Rule</strong></li>
<li>Rule xác định: vẽ trên hay dưới một đối tượng đích (drawable item, không phải group)</li>
<li>Trong Animate Mode, dùng radio button cạnh Rule để đặt key</li>
<li>Draw Order dùng <strong>Hold key</strong> — không thể nội suy</li>
</ol>`,

'state-machine': `<h1>State Machine trong Rive</h1>
<p class="subtitle">Hệ thống logic kết nối animation và định nghĩa hành vi tương tác — trái tim của mọi trải nghiệm động.</p>
<div class="tags"><span class="tag">state-machine</span><span class="tag">states</span><span class="tag">transitions</span><span class="tag">listeners</span></div>
<h2>Tổng quan</h2>
<p>State Machine là cách <strong>trực quan</strong> để kết nối animation và xác định logic điều khiển transitions. Mỗi artboard có ít nhất một State Machine mặc định.</p>
<pre><code>State Machine
├── Graph (không gian đồ họa)
│   ├── States (các trạng thái)
│   └── Transitions (đường nối)
├── Inputs (legacy — deprecated, dùng Data Binding)
├── Listeners (tương tác người dùng)
└── Layers (nhiều luồng animation song song)</code></pre>
<h2>States (Trạng thái)</h2>
<h3>Default States</h3>
<table>
<tr><th>State</th><th>Chức năng</th></tr>
<tr><td><strong>Entry</strong></td><td>Điểm bắt đầu — State Machine khởi động từ đây</td></tr>
<tr><td><strong>Exit</strong></td><td>Báo hiệu layer dừng phát. Chủ yếu dùng khi có nhiều Layer</td></tr>
<tr><td><strong>Any State</strong></td><td>Transition từ Any State có thể kích hoạt bất kỳ lúc nào — dùng cho hành động đột ngột như đổi skin</td></tr>
</table>
<h3>Animation States</h3>
<ul>
<li><strong>Single Animation</strong>: gắn một timeline. Phổ biến nhất</li>
<li><strong>1D Blend State</strong>: pha trộn nhiều timeline theo <em>một</em> giá trị số. Dùng cho loading bar, health bar</li>
<li><strong>Additive Blend State</strong>: pha trộn nhiều timeline bằng nhiều số input riêng lẻ. Dùng cho facial rig, nhiều biểu cảm kết hợp</li>
</ul>
<h2>Transitions</h2>
<p>Transition là đường nối định nghĩa lộ trình giữa các States.</p>
<h3>Cấu hình Transition</h3>
<ul>
<li><strong>Duration</strong>: thời gian chuyển đổi. Mặc định = 0ms. Khi &gt; 0, thuộc tính được nội suy giữa hai trạng thái</li>
<li><strong>Exit Time</strong>: State phải phát bao nhiêu % trước khi transition có thể xảy ra</li>
<li><strong>Pause When Exiting</strong>: pause animation đang rời khi transition xảy ra</li>
</ul>
<h3>Conditions (Điều kiện)</h3>
<ul>
<li>Nhiều điều kiện trên một transition = điều kiện <strong>AND</strong> — tất cả phải đúng</li>
<li>Nhiều transition từ A đến B = điều kiện <strong>OR</strong> — một đúng là đủ</li>
</ul>
<h2>Listeners (Tương tác người dùng)</h2>
<p>Cho phép designer tạo hành vi tương tác <strong>trực tiếp trong Rive, không cần code</strong>.</p>
<h3>User Actions</h3>
<table>
<tr><th>Action</th><th>Mô tả</th></tr>
<tr><td>Pointer Down / Up</td><td>Nhấn / nhả chuột hoặc ngón tay</td></tr>
<tr><td>Pointer Enter / Exit</td><td>Con trỏ vào / ra khỏi vùng target</td></tr>
<tr><td>Pointer Move</td><td>Di chuyển trong vùng target</td></tr>
<tr><td>Click</td><td>Pointer Down + Up trong cùng target</td></tr>
<tr><td>Listen for Event</td><td>Lắng nghe Event từ Artboard hoặc Component</td></tr>
</table>
<h3>Listener Actions</h3>
<ul>
<li><strong>View Model Change</strong> (mặc định): cập nhật View Model property. Ưu tiên dùng</li>
<li><strong>Report Event</strong>: bắn một Event mỗi khi User Action xảy ra</li>
<li><strong>Align Target</strong>: di chuyển đối tượng theo con trỏ</li>
</ul>
<h2>Layers</h2>
<p>Một Layer chỉ phát <strong>một animation tại một thời điểm</strong>. Nhiều Layer → nhiều animation song song.</p>
<p><strong>Layer Order:</strong> Layer bên <strong>phải</strong> có độ ưu tiên cao hơn khi pha trộn cùng thuộc tính.</p>
<h2>Luồng làm việc điển hình</h2>
<ol>
<li>Tạo các animation (timeline) trong Animate Mode</li>
<li>Tạo State Machine, thêm State cho từng animation</li>
<li>Kết nối States bằng Transitions</li>
<li>Thêm Conditions (Data Binding khuyến nghị cho project mới)</li>
<li>Thêm Listeners để phản hồi tương tác</li>
<li>Thêm Layers nếu cần animation song song</li>
<li>Test với Play button trong editor</li>
</ol>`,

'components': `<h1>Components trong Rive</h1>
<p class="subtitle">Cơ chế tái sử dụng artboard và hoạt hình — tương tự Components trong Figma nhưng animation-aware.</p>
<div class="tags"><span class="tag">component</span><span class="tag">nested-artboard</span><span class="tag">instance</span><span class="tag">tai-su-dung</span></div>
<h2>Tổng quan</h2>
<p>Một <strong>Component</strong> là artboard được đánh dấu để tái sử dụng. Đặt nhiều <strong>instance</strong> vào bất kỳ artboard nào — khi sửa Component gốc, tất cả instance tự động cập nhật.</p>
<div class="warn-box"><p>⚠️ <strong>Quan trọng:</strong> Chỉ artboard được đánh dấu là Component mới được xuất vào file <code>.riv</code>. Nếu muốn truy cập artboard từ runtime, hãy đánh dấu là Component.</p></div>
<h2>Tạo Component</h2>
<ol>
<li>Chọn artboard → nhấn icon Component trong Inspector</li>
<li>Phím tắt: <code>Shift+N</code></li>
<li>Figma users: <code>Cmd/Ctrl+Alt+K</code></li>
</ol>
<p><strong>Huỷ Component:</strong> <code>Shift+Alt+N</code>.</p>
<h2>Đặt Instance</h2>
<ol>
<li>Chọn <strong>Component Tool</strong> (phím <code>N</code>) trong Toolbar</li>
<li>Click vào Stage → chọn Component muốn instance</li>
</ol>
<h2>Cấu hình Instance</h2>
<h3>Gắn Animation</h3>
<ul>
<li><strong>Simple</strong>: phát animation đơn giản</li>
<li><strong>Remap</strong>: key giá trị thời gian của animation (0%=đầu, 100%=cuối). Kéo dài, thu ngắn, hoặc phát ngược</li>
</ul>
<h3>Mix Value</h3>
<p>Khi có nhiều animation trong instance, chúng pha trộn. Animation có mix khác 0 <strong>luôn pha trộn</strong>, kể cả không có play key. Để chỉ một animation phát: key animation muốn = 100%, các cái còn lại = 0%.</p>
<h2>Instance Modes</h2>
<table>
<tr><th>Mode</th><th>Mô tả</th></tr>
<tr><td><strong>Node</strong> (mặc định)</td><td>Kịch bản không responsive. Nội dung hiển thị theo tỉ lệ (Scale)</td></tr>
<tr><td><strong>Leaf</strong></td><td>Định vị và thay đổi kích thước theo Layout/Artboard cha. Hỗ trợ Leaf Fit: Fill, Contain, Cover, Fit Width/Height, None, Scale Down</td></tr>
<tr><td><strong>Layout</strong></td><td>Khi Component chứa Layouts cần responsive — artboard thay đổi kích thước thay vì scale</td></tr>
</table>
<h2>Expose Inputs và Events</h2>
<p>Component có thể <strong>expose</strong> Inputs và Events để artboard cha điều khiển.</p>
<h3>Cách Expose Input</h3>
<ol>
<li>Chọn input trong State Machine của Component</li>
<li>Tick "Expose to main artboard" trong Inspector</li>
</ol>
<p>Artboard cha truy cập qua Listener (thay đổi trực tiếp) hoặc Event (lắng nghe rồi kích hoạt input khác).</p>`,

'data-binding': `<h1>Data Binding trong Rive</h1>
<p class="subtitle">Hệ thống kết nối phản ứng giữa editor, dữ liệu và code runtime theo mô hình MVVM.</p>
<div class="tags"><span class="tag">data-binding</span><span class="tag">view-model</span><span class="tag">mvvm</span><span class="tag">runtime</span></div>
<h2>Tổng quan</h2>
<p>Data Binding xây dựng theo mô hình <strong>MVVM (Model-View-ViewModel)</strong>. Designer và developer cùng đồng ý về một tập dữ liệu trung gian: designer bind visual vào dữ liệu đó; developer cập nhật từ code — và mọi thứ tự động phản chiếu.</p>
<p><strong>Hai lợi ích chính:</strong></p>
<ol>
<li><strong>Tách biệt thiết kế và code</strong>: đổi tên layer không vỡ code; thay đổi logic không cần sửa file Rive</li>
<li><strong>Logic universal</strong>: hoạt động giống nhau trên mọi runtime (iOS, Android, Web...) không cần implement lại</li>
</ol>
<div class="warn-box"><p>Data Binding là sự thay thế cho <strong>State Machine Inputs (đã deprecated)</strong>. Inputs cũ vẫn hoạt động — không cần migrate file hiện có — nhưng nên dùng Data Binding cho mọi công việc mới.</p></div>
<h2>Các khái niệm cốt lõi</h2>
<h3>View Model</h3>
<p>Blueprint cho một tập dữ liệu — giống <code>class</code> trong OOP. Định nghĩa tên và kiểu của properties, không có giá trị cụ thể.</p>
<p>Ví dụ: View Model "MenuItem" có <code>label</code> (String), <code>icon</code> (Image), <code>isActive</code> (Boolean).</p>
<h3>View Model Instance</h3>
<p>Phiên bản sống của View Model — giống <code>object instance</code>. Instance có giá trị thực cụ thể. Tạo nhiều instance từ một View Model.</p>
<ul>
<li><strong>Exported</strong>: developer thấy và gán lúc runtime</li>
<li><strong>Internal</strong>: chỉ test thiết kế trong editor</li>
</ul>
<h3>Binding</h3>
<p>Liên kết giữa View Model Property và editor element. Sau khi bind, element lấy giá trị từ property.</p>
<h4>Bind Direction</h4>
<table>
<tr><th>Hướng</th><th>Nghĩa</th></tr>
<tr><td><strong>Source → Target</strong> (mặc định)</td><td>Property cập nhật element</td></tr>
<tr><td><strong>Target → Source</strong></td><td>Element cập nhật property</td></tr>
<tr><td><strong>Bidirectional</strong></td><td>Cả hai chiều</td></tr>
<tr><td><strong>Bind Once</strong></td><td>Chỉ áp dụng giá trị ban đầu, sau đó dừng</td></tr>
</table>
<h3>View Model Nesting</h3>
<p>View Model có thể chứa View Model khác làm property — cấu trúc lồng nhau tương tự components.</p>
<h3>Converter</h3>
<p>Biến đổi giá trị của binding trước khi áp dụng: Number → String, nhân đôi, Enum → Uint...</p>
<h2>Luồng làm việc điển hình</h2>
<ol>
<li>Tạo View Model trong Data panel</li>
<li>Thêm properties (Number, String, Boolean, v.v.)</li>
<li>Tạo View Model Instance với giá trị cụ thể</li>
<li>Gán Instance cho Artboard</li>
<li>Chọn editor element → bind property vào nó</li>
<li>Chạy State Machine để xem kết quả</li>
<li>Developer truy cập qua runtime API để cập nhật giá trị</li>
</ol>`,

'property-types': `<h1>Property Types và Enums</h1>
<p class="subtitle">Chín kiểu dữ liệu mà một View Model Property có thể mang — từ số, chuỗi đến danh sách và artboard động.</p>
<div class="tags"><span class="tag">data-binding</span><span class="tag">property-types</span><span class="tag">enums</span><span class="tag">view-model</span></div>
<h2>Bảng tóm tắt 9 kiểu</h2>
<table>
<tr><th>Kiểu</th><th>Giá trị</th><th>Ví dụ dùng</th></tr>
<tr><td><strong>Number</strong></td><td>Số thực</td><td>Vị trí X, kích thước, opacity, health bar</td></tr>
<tr><td><strong>String</strong></td><td>Văn bản</td><td>Tên người dùng, nhãn nút, tiêu đề</td></tr>
<tr><td><strong>Boolean</strong></td><td>true / false</td><td>Hiển thị/ẩn, bật/tắt</td></tr>
<tr><td><strong>Color</strong></td><td>Giá trị RGBA</td><td>Màu icon, màu nền theo theme</td></tr>
<tr><td><strong>Trigger</strong></td><td>Sự kiện fire-and-forget</td><td>Nhấn nút, hành động một lần</td></tr>
<tr><td><strong>Enum</strong></td><td>Một trong tập giá trị cố định</td><td>Chế độ căn lề, trạng thái, biến thể</td></tr>
<tr><td><strong>Image</strong></td><td>Tham chiếu asset ảnh</td><td>Avatar, thumbnail sản phẩm</td></tr>
<tr><td><strong>Artboard</strong></td><td>Tham chiếu artboard</td><td>Swap component động lúc runtime</td></tr>
<tr><td><strong>List</strong></td><td>Tập hợp View Model instances</td><td>Menu động, feed, bảng xếp hạng</td></tr>
</table>
<h2>Chi tiết từng kiểu quan trọng</h2>
<h3>Trigger</h3>
<p>Đại diện cho sự kiện "bắn rồi quên" (fire-and-forget). Dùng khi muốn báo hiệu rằng điều gì đó đã xảy ra mà không cần giữ trạng thái.</p>
<h3>Enum</h3>
<p>Cho phép chọn một giá trị từ tập hợp được định nghĩa sẵn.</p>
<ul>
<li><strong>System Enum</strong>: tùy chọn có sẵn của editor (ví dụ: Horizontal Align — Left, Center, Right)</li>
<li><strong>Custom Enum</strong>: tùy chọn tự định nghĩa</li>
</ul>
<pre><code>Vấn đề với String:  "Monday" vs "monday" vs "Mon" — tất cả đều sai khác nhau
Vấn đề với Number: 0 hay 1 là thứ Hai? Tuần bắt đầu từ đâu?
Giải pháp Enum:     giá trị luôn hợp lệ và rõ nghĩa</code></pre>
<p>Dùng Enum để điều khiển Solo — map từng giá trị Enum vào một Solo để chuyển đổi giữa các biến thể visual.</p>
<h3>Image</h3>
<p>Lưu tham chiếu đến ảnh, cho phép thay đổi ảnh hiển thị theo instance. Chỉ ảnh hưởng <strong>một instance cụ thể</strong>. Nếu cần thay đổi toàn cục cho tất cả instance → dùng <strong>asset loading</strong>.</p>
<h3>Artboard</h3>
<p>Tham chiếu và swap artboard động lúc runtime. Artboard từ file hiện tại hoặc từ file <code>.riv</code> khác. Artboard phải được chuyển thành Component trước khi dùng làm property.</p>
<h3>List</h3>
<p>Tập hợp View Model instances — sinh danh sách động. Xem <em>Lists trong Rive</em> để biết chi tiết.</p>`,

'property-groups': `<h1>Property Groups</h1>
<p class="subtitle">Cầu nối giữa timeline animation local và dữ liệu View Model global.</p>
<div class="tags"><span class="tag">data-binding</span><span class="tag">property-groups</span><span class="tag">timeline</span><span class="tag">animation</span></div>
<h2>Tổng quan</h2>
<p>Trong hệ thống Data Binding có một khoảng cách cần giải quyết:</p>
<ul>
<li><strong>View Model Properties</strong> là <strong>global</strong> — chia sẻ toàn file, nhìn thấy từ code runtime</li>
<li><strong>Timeline và State Machine</strong> là <strong>local</strong> — thuộc về từng artboard, không key trực tiếp lên View Model Property</li>
</ul>
<p>Property Groups lấp đầy khoảng cách này — giá trị <strong>local ở cấp artboard</strong>, có thể key trên timeline, đồng thời bind đến/từ View Model Properties.</p>
<h2>Trường hợp dùng điển hình</h2>
<h3>1. Điều khiển View Model Property bằng Timeline</h3>
<pre><code>Timeline keyframes → Property Group value → (binding) → View Model Property → developer</code></pre>
<p><strong>Ví dụ:</strong> Animation "coin collect" muốn tăng biến <code>score</code> → key Property Group từ 0→1, bind với converter "Add" để cộng vào giá trị hiện tại.</p>
<h3>2. Điều khiển một View Model Property bằng Property khác</h3>
<p>Không thể bind trực tiếp View Model Property → View Model Property (tránh dependency loop). Dùng Property Group làm trung gian:</p>
<pre><code>View Model Property A → (binding) → Property Group → (binding) → View Model Property B</code></pre>
<p><strong>Ví dụ:</strong> <code>myOtherNumber</code> = <code>myNumber</code> × 2 → bind <code>myNumber</code> vào Property Group với Converter "Multiply by 2", rồi bind Property Group ra <code>myOtherNumber</code>.</p>
<h2>Tại sao không key trực tiếp View Model Property?</h2>
<p>View Model Properties đại diện cho dữ liệu global toàn app. Cho phép key trực tiếp sẽ tạo side effect toàn cục mỗi khi timeline chạy — không thể kiểm soát trong môi trường runtime phức tạp.</p>`,

'lists': `<h1>Lists trong Rive</h1>
<p class="subtitle">Danh sách động sinh từ dữ liệu View Model — UI thay đổi theo thời gian thực mà không cần thiết kế thủ công từng phần tử.</p>
<div class="tags"><span class="tag">data-binding</span><span class="tag">lists</span><span class="tag">view-model</span><span class="tag">layouts</span></div>
<h2>Tổng quan</h2>
<p>List hiển thị tập hợp phần tử tự động từ View Model. Thay vì thiết kế cứng 5, 10, 20 item — thiết kế <strong>một artboard mẫu</strong> (item template), Rive tự nhân bản theo số lượng dữ liệu.</p>
<p><strong>Ứng dụng:</strong> Menu linh hoạt, product listings, notification feeds, chat messages, dropdown menus, danh sách liên lạc, bảng xếp hạng.</p>
<h2>Artboard Lists</h2>
<p>Artboard List dùng một Artboard làm template cho mỗi item. Điều kiện: Artboard List phải là con của Artboard hoặc Layout.</p>
<p><strong>Tạo:</strong> Chọn Artboard hoặc Layout → Inspector → "Add Artboard List".</p>
<h2>Hai cách populate List</h2>
<h3>Cách 1: View Model List Property</h3>
<p>Dùng khi mỗi item cần dữ liệu riêng (label, ảnh, trạng thái khác nhau).</p>
<pre><code>View Model → thêm property kiểu List → List items là VM Instances
→ bind List property vào Artboard List → State Machine chạy → items xuất hiện</code></pre>
<h3>Cách 2: View Model Number + Converter "Number to List"</h3>
<p>Dùng khi chỉ cần kiểm soát số lượng item, không cần dữ liệu riêng cho từng item.</p>
<pre><code>View Model Number property → Converter "Number to List" → Artboard List
(giá trị Number = số lượng items được sinh ra)</code></pre>
<h2>View Model List Item Index</h2>
<p>Mỗi item có thể biết vị trí index của nó. Thêm qua: <code>+</code> → List Attributes → Index.</p>
<p>Dùng index để: thay đổi vị trí theo vị trí trong list, hiển thị số thứ tự, logic khác nhau cho từng item.</p>
<h2>Lists và Scrolling</h2>
<p>Khi Artboard List là con của Layout có <strong>Scroll Constraint</strong>, items tự động cuộn.</p>
<ul>
<li><strong>Virtualize</strong>: chỉ render items trong viewport — cải thiện hiệu năng danh sách dài (chỉ một chiều)</li>
<li><strong>Carousel</strong>: cuộn vô tận. Yêu cầu Virtualize phải bật</li>
</ul>
<h2>Layout của List</h2>
<p>Direction, wrapping, padding, gap, alignment được quyết định bởi <strong>parent container</strong>, không phải Artboard List. Chỉnh settings trên parent Layout.</p>`,

'layouts': `<h1>Layouts trong Rive</h1>
<p class="subtitle">Hệ thống UI responsive theo mô hình Flexbox — giao diện co giãn, tự sắp xếp, lồng nhau không cần định vị thủ công.</p>
<div class="tags"><span class="tag">layouts</span><span class="tag">flexbox</span><span class="tag">ui</span><span class="tag">responsive</span></div>
<h2>Tổng quan</h2>
<p>Layouts là container đặc biệt tham gia hệ thống <strong>flex layout</strong> (tương tự Flexbox CSS). Layouts lồng nhau tạo cấu trúc phức tạp, kết hợp với freeform canvas truyền thống của Rive.</p>
<div class="warn-box"><p>⚠️ Flex parameters (Row/Column/Wrap/Alignment/Gap) chỉ tác dụng lên <strong>Layout children</strong> — không ảnh hưởng Shape, Group, Text đặt trực tiếp bên trong nếu chúng không phải là Layout.</p></div>
<h2>Hai loại Layout</h2>
<h3>Absolute Layout</h3>
<ul>
<li>Tự định vị trong artboard hoặc parent Layout</li>
<li>Ghim 2+ cạnh vào container (horizontal + vertical)</li>
<li>Kéo thả tự do trên Stage như object bình thường</li>
<li>Dùng khi cần đặt UI element ở vị trí cố định</li>
</ul>
<h3>Relative Layout</h3>
<ul>
<li>Vị trí do parent quyết định qua flex flow</li>
<li>Tham gia Row/Column của parent</li>
<li>Dùng cho nội dung cần sắp xếp tự động</li>
</ul>
<h2>Scale Types</h2>
<table>
<tr><th>Kiểu</th><th>Hành vi</th><th>Khi dùng</th></tr>
<tr><td><strong>Fixed</strong></td><td>Kích thước cố định (điểm hoặc %)</td><td>Biết rõ kích thước cần</td></tr>
<tr><td><strong>Hug</strong></td><td>Co lại vừa nội dung bên trong</td><td>Label, text, nội dung động</td></tr>
<tr><td><strong>Fill</strong></td><td>Điền đầy không gian còn lại</td><td>Navigation bar, content area</td></tr>
</table>
<p><strong>Fill ratio (<code>fr</code>):</strong> Khi nhiều child đều dùng Fill, <code>fr</code> quyết định tỉ lệ. Ví dụ: sidebar <code>1fr</code> + content <code>3fr</code> → 25% / 75%.</p>
<h2>Padding và Margin</h2>
<table>
<tr><th>Thuộc tính</th><th>Tác động</th><th>CSS tương tự</th></tr>
<tr><td><strong>Padding</strong></td><td>Khoảng cách giữa bounds Layout và Layout children bên trong</td><td>padding</td></tr>
<tr><td><strong>Margin</strong></td><td>Khoảng cách giữa Layout và parent Layout</td><td>margin</td></tr>
</table>
<h2>Flex Parameters</h2>
<table>
<tr><th>Tham số</th><th>Tùy chọn</th></tr>
<tr><td>Direction</td><td>Row, Column, Row Reverse, Column Reverse</td></tr>
<tr><td>Wrap</td><td>No Wrap, Wrap, Wrap Reverse</td></tr>
<tr><td>Alignment</td><td>9 điểm neo (inspector widget)</td></tr>
<tr><td>Gap</td><td>Khoảng cách giữa items (ngang + dọc)</td></tr>
<tr><td>LTR/RTL</td><td>Left-to-Right hoặc Right-to-Left (cascades xuống children)</td></tr>
</table>
<h2>Styles trên Layout</h2>
<p>Layout không chỉ là container trong suốt — có thể áp dụng Fill, Stroke, Feather, Blend Mode, Corner Radius.</p>
<ul>
<li><strong>Background</strong>: render dưới children (drop shadow ẩn sau nội dung)</li>
<li><strong>Foreground</strong>: render trên children (stroke viền bao quanh)</li>
</ul>
<h2>Công cụ tạo Layout</h2>
<ul>
<li><strong>Layout Tool</strong>: kéo trên artboard → Absolute; kéo vào Layout có sẵn → Relative child</li>
<li><strong>Row/Column Tool</strong>: tạo Layout với children sẵn có</li>
<li><strong>Wrap in Layout</strong>: chọn object → right-click → "Wrap in" → "Layout", hoặc <code>Shift+L</code></li>
</ul>`,

'scrolling-nslicing': `<h1>Scrolling và N-Slicing</h1>
<p class="subtitle">Hai tính năng mở rộng Layouts: Scrolling cho phép cuộn nội dung; N-Slicing cho phép scale ảnh và vector mà không biến dạng.</p>
<div class="tags"><span class="tag">scrolling</span><span class="tag">n-slicing</span><span class="tag">constraints</span><span class="tag">responsive</span></div>
<h2>Scrolling</h2>
<h3>Cơ chế hoạt động</h3>
<p>Scrolling thực hiện qua <strong>Scroll Constraint</strong> — ràng buộc áp dụng lên Layout.</p>
<pre><code>Scroll View (Layout — định nghĩa vùng nhìn thấy)
└── Scroll Content (Layout — áp dụng Scroll Constraint)
    ├── Item 1 (Layout)
    ├── Item 2 (Layout)
    └── ...</code></pre>
<p>Kích thước Scroll Content lớn hơn Scroll View → phần thừa cuộn vào. Thường đặt Scroll Content ở Hug.</p>
<p><strong>Tạo:</strong> Chọn Scroll Content Layout → Constraints Inspector → Add → "Scroll Content" constraint.</p>
<h3>Thuộc tính Scroll Constraint</h3>
<table>
<tr><th>Thuộc tính</th><th>Chi tiết</th></tr>
<tr><td>Direction</td><td>Vertical / Horizontal / All</td></tr>
<tr><td>Scroll Percent X/Y</td><td>% vị trí cuộn (0%=đầu, 100%=cuối) — có thể key</td></tr>
<tr><td>Scroll Index</td><td>Index của item cần cuộn tới — có thể key</td></tr>
<tr><td>Physics</td><td><strong>Elastic</strong> (iOS style, deceleration + rubber band) hoặc <strong>Clamped</strong> (drag đơn giản)</td></tr>
<tr><td>Snap</td><td>Dừng với một item nguyên vẹn ở đầu vùng scroll</td></tr>
</table>
<h3>List Scrolling</h3>
<p>Khi Artboard List là con của Scroll Content Layout → list items tự động cuộn.</p>
<ul>
<li><strong>Virtualize</strong>: chỉ render items trong viewport — cải thiện hiệu năng (chỉ một chiều)</li>
<li><strong>Carousel</strong>: cuộn vô tận. Yêu cầu Virtualize phải bật</li>
</ul>
<h2>N-Slicing</h2>
<h3>Khái niệm</h3>
<p>Mở rộng của kỹ thuật <strong>9-slice</strong>: chia ảnh thành 9 phần — 4 góc cố định, phần giữa co giãn. N-Slicing đi xa hơn: <strong>bất kỳ số lượng phân đoạn</strong>, áp dụng cho cả <strong>ảnh raster lẫn vector group</strong>.</p>
<h3>Hai loại N-Slice</h3>
<table>
<tr><th>Loại</th><th>Áp dụng cho</th><th>Hỗ trợ Tile Modes</th></tr>
<tr><td><strong>Image N-Slice</strong></td><td>Ảnh raster import vào Rive</td><td>Có</td></tr>
<tr><td><strong>Group N-Slice</strong></td><td>Vector group trong Rive</td><td>Không (chỉ Stretch)</td></tr>
</table>
<h3>Cơ chế hoạt động</h3>
<p>Các trục chia (axes) tạo ra phân đoạn xen kẽ <strong>cố định và scale</strong>. Phân đoạn đầu tiên = cố định; tiếp theo = scale; xen kẽ theo cả hai chiều.</p>
<p><strong>Setup:</strong></p>
<ol>
<li>Chọn image/group → vào edit mode</li>
<li>Mặc định 4 axes (2 dọc + 2 ngang) → 9 phân đoạn</li>
<li>Kéo axes để repositioning; nhập giá trị trong Inspector</li>
<li>Kéo từ outer bounds để tạo axis mới (mặc định tạo mirrored axis)</li>
<li>Giữ <code>Cmd/Ctrl</code> khi kéo để tạo chỉ 1 axis</li>
</ol>
<div class="warn-box"><p>⚠️ Setup N-Slice <strong>trước</strong> khi scale/resize image — khó position lại axes trên ảnh đã scale.</p></div>
<h3>Tile Modes (chỉ cho Image N-Slice)</h3>
<table>
<tr><th>Mode</th><th>Hành vi</th></tr>
<tr><td><strong>Stretch</strong></td><td>Kéo giãn phân đoạn khi resize</td></tr>
<tr><td><strong>Repeat</strong></td><td>Tile (lặp lại) phân đoạn khi resize</td></tr>
<tr><td><strong>Hidden</strong></td><td>Ẩn phân đoạn hoàn toàn</td></tr>
</table>`

    // ─── Sidebar builder ─────────────────────────────────────────────────────────

    function buildSidebar(filter = '') {
        const nav = document.getElementById('sidebar-nav');
        nav.innerHTML = '';
        const lf = filter.toLowerCase().trim();
        sections.forEach(section => {
            const matching = lf
                ? section.items.filter(i => i.label.toLowerCase().includes(lf))
                : section.items;
            if (!matching.length) return;
            const title = document.createElement('div');
            title.className = 'sidebar-section-title';
            title.textContent = section.title;
            nav.appendChild(title);
            matching.forEach(item => {
                const a = document.createElement('div');
                a.className = 'sidebar-item' + (currentId === item.id ? ' active' : '');
                a.textContent = item.label;
                a.setAttribute('data-id', item.id);
                a.addEventListener('click', () => loadArticle(item.id));
                nav.appendChild(a);
            });
        });
    }

    // ─── Article loader ───────────────────────────────────────────────────────────

    let currentId = 'rive';

    function loadArticle(id) {
        if (!articles[id]) return;
        currentId = id;
        const content = document.getElementById('wiki-content');
        const body = document.getElementById('article-body');

        content.classList.add('fading');
        setTimeout(() => {
            body.innerHTML = articles[id];
            content.classList.remove('fading');
            content.scrollTop = 0;
            window.scrollTo(0, 0);
        }, 120);

        // Update sidebar active state
        document.querySelectorAll('.sidebar-item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-id') === id);
        });

        // Update URL hash without scroll
        history.replaceState(null, '', '#' + id);

        // Close mobile sidebar
        document.getElementById('wiki-sidebar').classList.remove('open');
    }

    // ─── Search ───────────────────────────────────────────────────────────────────

    document.getElementById('wiki-search').addEventListener('input', function() {
        buildSidebar(this.value);
    });

    // ─── Mobile toggle ────────────────────────────────────────────────────────────

    document.getElementById('sidebar-toggle').addEventListener('click', () => {
        document.getElementById('wiki-sidebar').classList.toggle('open');
    });

    // ─── Init ────────────────────────────────────────────────────────────────────

    async function initWiki() {
        // Priority 1: wiki-data.json (written by CMS Save)
        try {
            const resp = await fetch('wiki-data.json?t=' + Date.now());
            if (resp.ok) {
                const d = await resp.json();
                if (d.sections && d.articles) {
                    sections.splice(0, sections.length, ...d.sections);
                    Object.keys(articles).forEach(k => delete articles[k]);
                    Object.assign(articles, d.articles);
                }
            }
        } catch (_) {
            // Priority 2: localStorage (written by CMS auto-save)
            try {
                const saved = localStorage.getItem('wikiCMSData');
                if (saved) {
                    const d = JSON.parse(saved);
                    if (d.sections && d.articles) {
                        sections.splice(0, sections.length, ...d.sections);
                        Object.keys(articles).forEach(k => delete articles[k]);
                        Object.assign(articles, d.articles);
                    }
                }
            } catch (_) {}
        }

        const hashId = window.location.hash.replace('#', '');
        if (hashId && articles[hashId]) currentId = hashId;

        buildSidebar();
        document.getElementById('article-body').innerHTML = articles[currentId] || '';
    }

    initWiki();

    </script>
